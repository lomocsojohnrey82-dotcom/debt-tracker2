<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Store Debt Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧾 Store Debt Tracker</h1>
    <button class="btn ghost" id="exportBtn" type="button">Export CSV</button>
  </header>

  <section class="stats">
    <div class="stat"><span>Total receivables (owed to store)</span><strong id="statTotal">₱0.00</strong></div>
    <div class="stat"><span>Customers with unpaid balance</span><strong id="statDebtors">0</strong></div>
    <div class="stat"><span>Total customers</span><strong id="statCustomers">0</strong></div>
  </section>

  <div class="grid">
    <div>
      <div class="card">
        <h2>Add customer</h2>
        <form id="customerForm" autocomplete="off">
          <input id="custName" placeholder="Customer name" required>
          <input id="custPhone" placeholder="Phone (optional)">
          <button class="btn" type="submit">Add customer</button>
          <p id="custMsg" class="msg"></p>
        </form>
      </div>

      <div class="card">
        <h2>Record transaction</h2>
        <form id="txForm" autocomplete="off">
          <select id="txCustomer" required></select>
          <select id="txType">
            <option value="charge">Credit sale (utang)</option>
            <option value="payment">Payment received</option>
          </select>
          <input id="txAmount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
          <input id="txDate" type="date" required>
          <input id="txNote" placeholder="Items / note (optional)">
          <button class="btn" type="submit">Save transaction</button>
          <p id="txMsg" class="msg"></p>
        </form>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="row between" style="margin-bottom:12px">
          <h2 style="margin:0">Customers</h2>
          <input id="search" placeholder="Search name or phone" style="max-width:240px">
        </div>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Name</th><th>Phone</th><th class="num">Balance</th><th></th></tr></thead>
            <tbody id="custBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card" id="ledgerCard" hidden>
        <div class="row between" style="margin-bottom:8px">
          <h2 id="ledgerTitle" style="margin:0"></h2>
          <button class="btn danger small" id="delCustomer" type="button">Delete customer</button>
        </div>
        <p id="ledgerBalance" class="big"></p>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Date</th><th>Type</th><th>Note</th><th class="num">Amount</th><th class="num">Balance</th><th></th></tr></thead>
            <tbody id="ledgerBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
